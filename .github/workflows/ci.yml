name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-prod.txt

      - name: Install CPU dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          pip install -r requirements-prod.txt
          pip install pytest ruff

      - name: Lint with ruff
        run: ruff check config/models.py src/api/ scripts/locustfile.py scripts/benchmark_cost.py tests/test_api.py tests/test_retrieval.py

      - name: Run pytest suite (offline deterministic mode)
        env:
          OFFLINE_EVAL: "1"
        run: pytest tests/test_retrieval.py tests/test_api.py tests/test_reranker.py tests/test_chunking.py tests/test_indexing.py tests/test_query_planning.py tests/test_production_rag_p0.py tests/test_production_rag_p1.py -v

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: nexus-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI Test Suite & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Full Test Suite & Preserve Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      OFFLINE_EVAL: "1"
      ALLOW_MOCK_EMBEDDER: "1"
      PYTHONPATH: "."

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov scipy

      - name: Create Test Results Directory
        run: mkdir -p test-results metadata

      - name: Run Full Pytest Suite with JUnit XML Output
        id: run_tests
        run: |
          pytest tests/ -v \
            --junitxml=test-results/junit.xml \
            --durations=10 \
            2>&1 | tee test-results/pytest-output.log

      - name: Publish Test Summary to GitHub Step Summary
        if: always()
        run: |
          echo "### Test Execution Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "test-results/pytest-output.log" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 35 test-results/pytest-output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Preserve Test Output & Logs as CI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-logs
          path: |
            test-results/
            metadata/
          retention-days: 30

  benchmark:
    name: Run Standardized Benchmark & Tradeoff Validation
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OFFLINE_EVAL: "1"
      PYTHONPATH: "."

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scipy pytest

      - name: Run Standardized Benchmark on Test Slice
        run: |
          python scripts/run_reproducible_benchmark.py --limit 30 \
            --output-json metadata/ci_benchmark_results.json \
            --output-md metadata/ci_benchmark_report.md

      - name: Publish Benchmark Report to Step Summary
        if: always()
        run: |
          if [ -f "metadata/ci_benchmark_report.md" ]; then
            cat metadata/ci_benchmark_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Preserve Benchmark Reports as CI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-benchmark-artifacts
          path: metadata/
          retention-days: 30

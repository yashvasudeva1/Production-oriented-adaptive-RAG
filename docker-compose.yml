services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: nexus_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 1024m

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - QDRANT_URL=http://qdrant:6333
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - TESSERACT_CMD=/usr/bin/tesseract
    volumes:
      - ./documents:/app/documents
      - ./metadata:/app/metadata
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s
    mem_limit: 2560m

volumes:
  qdrant_storage:
